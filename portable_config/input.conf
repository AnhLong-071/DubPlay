# DubPlay — cấu hình phím + menu chuột phải.
# QUAN TRỌNG: tag menu của uosc phải viết sát dấu # ("#menu: ...") — nếu có
# dấu cách ("# menu:") uosc sẽ KHÔNG nhận và rơi về menu mặc định có trình
# duyệt file tích hợp. Mở file chỉ dùng hộp thoại Windows chuẩn (dubplay_*).

o    script-binding dubplay_open_video   #menu: Mở video khác
a    script-binding dubplay_pick_audio   #menu: Chọn audio lồng tiếng
s    script-binding dubplay_pick_sub     #menu: Chọn phụ đề
d    script-binding dubplay_duck_more    #menu: Tiếng gốc nhỏ thêm (khi dub nói)
D    script-binding dubplay_duck_less    #menu: Tiếng gốc to lại (khi dub nói)
x    script-binding dubplay_dub_quieter  #menu: Giọng dub nhỏ
X    script-binding dubplay_dub_louder   #menu: Giọng dub to
f    cycle fullscreen                    #menu: Toàn màn hình (f)
SPACE cycle pause                        #menu: Phát / Dừng (Space)
j    cycle sub                           #menu: Bật / tắt phụ đề (j)
q    quit                                #menu: Thoát (q)
