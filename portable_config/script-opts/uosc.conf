# DubPlay — custom hóa uosc.
# QUAN TRỌNG: không dùng nút track mặc định của uosc (subtitles/audio) vì chúng
# mở trình duyệt file ziggy tích hợp — thứ bị lỗi không liệt kê file trên máy
# này và không đúng triết lý DubPlay (mở file = hộp thoại Windows chuẩn).
# Nút tùy biến: command:icon:lệnh?mô tả — các lệnh dubplay_* mở hộp thoại native.
controls=play-pause,gap,fullscreen,command:library_music:script-binding dubplay_pick_audio?Chọn audio lồng tiếng (a),command:subtitles:script-binding dubplay_pick_sub?Chọn phụ đề (s),command:file_open:script-binding dubplay_open_video?Mở video khác (o)
